spring.application.name=ArgusIQ

spring.datasource.url=${ARGUSIQ_DB_URL:jdbc:postgresql://localhost:5432/argusiq}
spring.datasource.username=${ARGUSIQ_DB_USERNAME:argusiq}
spring.datasource.password=${ARGUSIQ_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${ARGUSIQ_JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${ARGUSIQ_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

server.port=${ARGUSIQ_SERVER_PORT:8080}

argusiq.security.investigation-username=${ARGUSIQ_INVESTIGATION_USERNAME:investigator}
argusiq.security.investigation-password=${ARGUSIQ_INVESTIGATION_PASSWORD}
argusiq.security.ingestion-username=${ARGUSIQ_INGESTION_USERNAME:collector}
argusiq.security.ingestion-password=${ARGUSIQ_INGESTION_PASSWORD}
argusiq.web.allowed-origins=${ARGUSIQ_ALLOWED_ORIGINS:http://localhost:5173}
